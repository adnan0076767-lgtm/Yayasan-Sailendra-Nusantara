  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      scroll-behavior:smooth;
    }

    :root{
      --dark:#09111f;
      --dark2:#101b2d;
      --dark3:#16243a;
      --gold:#d6a84f;
      --gold2:#f1d083;
      --gold3:#a77b28;
      --white:#fff;
      --text:#334155;
      --muted:#64748b;
      --light:#f6f8fb;
      --border:#e2e8f0;
      --shadow:0 18px 50px rgba(15,23,42,.08);
    }

    html{
      scroll-padding-top:90px;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#fff;
      color:var(--text);
      line-height:1.7;
      overflow-x:hidden;
    }

    body.menu-open{
      overflow:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font-family:inherit;
    }

    ::-webkit-scrollbar{
      width:8px;
    }

    ::-webkit-scrollbar-track{
      background:#08101d;
    }

    ::-webkit-scrollbar-thumb{
      background:var(--gold);
      border-radius:20px;
    }

    /* LOADER */

    #loader{
      position:fixed;
      inset:0;
      z-index:5000;
      background:var(--dark);
      display:flex;
      align-items:center;
      justify-content:center;
      transition:.6s ease;
    }

    #loader.hide{
      opacity:0;
      visibility:hidden;
    }

    .loader-inner{
      text-align:center;
      color:#fff;
    }

    .loader-symbol{
      width:70px;
      height:70px;
      border:2px solid rgba(214,168,79,.3);
      border-top-color:var(--gold2);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:auto;
      animation:spin 1.2s linear infinite;
    }

    .loader-symbol span{
      color:var(--gold2);
      font-size:27px;
      font-weight:bold;
      animation:counterSpin 1.2s linear infinite;
    }

    .loader-inner p{
      margin-top:18px;
      font-size:11px;
      letter-spacing:3px;
      color:#94a3b8;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    @keyframes counterSpin{
      to{transform:rotate(-360deg)}
    }

    /* NAVBAR */

    nav{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:2000;
      background:rgba(9,17,31,.72);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,255,255,.07);
      transition:.35s ease;
    }

    nav.scrolled{
      background:rgba(7,14,26,.97);
      box-shadow:0 8px 30px rgba(0,0,0,.18);
    }

    .nav-container{
      max-width:1220px;
      margin:auto;
      padding:14px 25px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:12px;
      color:#fff;
      position:relative;
      z-index:2002;
    }

    .logo-symbol{
      width:44px;
      height:44px;
      border:1px solid rgba(214,168,79,.8);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--gold2);
      font-size:20px;
      font-weight:bold;
      box-shadow:0 0 25px rgba(214,168,79,.08);
    }

    .logo-text strong{
      display:block;
      font-size:14px;
      letter-spacing:1.3px;
    }

    .logo-text span{
      display:block;
      font-size:9px;
      color:#94a3b8;
      letter-spacing:3px;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:5px;
      list-style:none;
    }

    .nav-links a{
      position:relative;
      display:block;
      padding:10px 12px;
      color:#dbe4ef;
      font-size:12px;
      transition:.3s;
    }

    .nav-links a::after{
      content:"";
      position:absolute;
      left:12px;
      right:12px;
      bottom:4px;
      height:2px;
      background:var(--gold);
      transform:scaleX(0);
      transform-origin:center;
      transition:.3s;
    }

    .nav-links a:hover,
    .nav-links a.active{
      color:var(--gold2);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after{
      transform:scaleX(1);
    }

    .menu-btn{
      display:none;
      width:42px;
      height:42px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:9px;
      background:rgba(255,255,255,.04);
      color:#fff;
      font-size:22px;
      cursor:pointer;
      position:relative;
      z-index:2002;
    }

    /* HERO */

    .hero{
      min-height:100vh;
      padding:150px 25px 100px;
      position:relative;
      overflow:hidden;
      color:#fff;
      display:flex;
      align-items:center;
      background:
        radial-gradient(circle at 78% 28%,rgba(214,168,79,.17),transparent 25%),
        radial-gradient(circle at 20% 80%,rgba(37,99,235,.08),transparent 30%),
        linear-gradient(135deg,#060e1b,#101b2d 55%,#17243a);
    }

    .hero::before{
      content:"";
      position:absolute;
      width:500px;
      height:500px;
      right:-220px;
      top:-200px;
      border:1px solid rgba(214,168,79,.09);
      border-radius:50%;
      box-shadow:
        0 0 0 70px rgba(214,168,79,.025),
        0 0 0 140px rgba(214,168,79,.018);
    }

    .hero::after{
      content:"";
      position:absolute;
      left:-100px;
      bottom:-180px;
      width:420px;
      height:420px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.04);
    }

    .hero-container{
      max-width:1220px;
      width:100%;
      margin:auto;
      display:grid;
      grid-template-columns:1.18fr .82fr;
      gap:70px;
      align-items:center;
      position:relative;
      z-index:2;
    }

    .hero-badge{
      display:inline-flex;
      align-items:center;
      gap:9px;
      padding:8px 15px;
      border:1px solid rgba(214,168,79,.4);
      border-radius:40px;
      color:var(--gold2);
      background:rgba(214,168,79,.04);
      font-size:10px;
      letter-spacing:2px;
      margin-bottom:22px;
    }

    .hero-badge::before{
      content:"";
      width:6px;
      height:6px;
      background:var(--gold);
      border-radius:50%;
      box-shadow:0 0 10px var(--gold);
    }

    .hero h1{
      font-size:clamp(44px,6vw,78px);
      line-height:1.02;
      letter-spacing:-3px;
      margin-bottom:23px;
    }

    .hero h1 span{
      color:var(--gold2);
    }

    .hero p{
      max-width:670px;
      color:#b8c4d4;
      font-size:16px;
      margin-bottom:34px;
    }

    .hero-buttons{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      min-height:46px;
      padding:12px 22px;
      border-radius:8px;
      font-size:13px;
      font-weight:bold;
      transition:.3s ease;
    }

    .btn-primary{
      background:linear-gradient(135deg,var(--gold),#bd8d32);
      color:#101827;
      box-shadow:0 10px 30px rgba(214,168,79,.13);
    }

    .btn-primary:hover{
      transform:translateY(-3px);
      box-shadow:0 15px 35px rgba(214,168,79,.22);
    }

    .btn-outline{
      border:1px solid rgba(255,255,255,.22);
      color:#fff;
      background:rgba(255,255,255,.025);
    }

    .btn-outline:hover{
      border-color:var(--gold);
      color:var(--gold2);
      transform:translateY(-3px);
    }

    .hero-mini-info{
      display:flex;
      gap:28px;
      margin-top:40px;
      flex-wrap:wrap;
    }

    .mini-item{
      display:flex;
      align-items:center;
      gap:9px;
      color:#aab8c9;
      font-size:11px;
    }

    .mini-item b{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 12px rgba(214,168,79,.5);
    }

    .hero-card{
      min-height:440px;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    .orbit{
      position:absolute;
      width:360px;
      height:360px;
      border:1px solid rgba(214,168,79,.16);
      border-radius:50%;
      animation:orbitRotate 18s linear infinite;
    }

    .orbit::before,
    .orbit::after{
      content:"";
      position:absolute;
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 18px rgba(214,168,79,.8);
    }

    .orbit::before{
      top:25px;
      left:60px;
    }

    .orbit::after{
      right:25px;
      bottom:75px;
    }

    @keyframes orbitRotate{
      to{transform:rotate(360deg)}
    }

    .circle-main{
      width:300px;
      height:300px;
      border-radius:50%;
      border:1px solid rgba(214,168,79,.48);
      background:radial-gradient(circle,rgba(214,168,79,.08),transparent 65%);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      box-shadow:
        inset 0 0 50px rgba(214,168,79,.05),
        0 0 80px rgba(214,168,79,.05);
    }

    .circle-main::before{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      border-radius:50%;
      border:1px solid rgba(214,168,79,.25);
    }

    .circle-main::after{
      content:"";
      position:absolute;
      width:145px;
      height:145px;
      border-radius:50%;
      border:1px dashed rgba(214,168,79,.18);
    }

    .circle-content{
      text-align:center;
      position:relative;
      z-index:2;
    }

    .circle-content .big{
      font-size:76px;
      line-height:1;
      color:var(--gold2);
      font-weight:bold;
      text-shadow:0 0 35px rgba(214,168,79,.16);
    }

    .circle-content h3{
      font-size:18px;
      letter-spacing:3px;
      margin-top:8px;
    }

    .circle-content p{
      font-size:10px;
      letter-spacing:4px;
      color:#8492a5;
      margin:2px 0 0;
    }

    /* GENERAL */

    section{
      padding:100px 25px;
    }

    .container{
      max-width:1220px;
      margin:auto;
    }

    .section-header{
      text-align:center;
      max-width:720px;
      margin:0 auto 58px;
    }

    .section-label{
      color:var(--gold3);
      text-transform:uppercase;
      letter-spacing:3px;
      font-size:10px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .section-header h2{
      font-size:40px;
      line-height:1.15;
      color:var(--dark);
      margin-bottom:14px;
      letter-spacing:-1px;
    }

    .section-header p{
      color:var(--muted);
      font-size:14px;
    }

    /* REVEAL */

    .reveal{
      opacity:0;
      transform:translateY(35px);
      transition:opacity .8s ease,transform .8s ease;
    }

    .reveal.show{
      opacity:1;
      transform:translateY(0);
    }

    /* ABOUT */

    .about{
      background:#fff;
    }

    .about-grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:65px;
      align-items:center;
    }

    .about-box{
      padding:42px;
      position:relative;
      background:linear-gradient(145deg,#f8fafc,#f3f6fa);
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
    }

    .about-box::after{
      content:"S";
      position:absolute;
      right:-25px;
      bottom:-65px;
      font-size:190px;
      font-weight:bold;
      color:rgba(214,168,79,.05);
      line-height:1;
    }

    .about-box h3{
      position:relative;
      z-index:1;
      color:var(--dark);
      font-size:25px;
      line-height:1.3;
      margin-bottom:17px;
    }

    .about-box p{
      position:relative;
      z-index:1;
      margin-bottom:14px;
      color:var(--muted);
      font-size:14px;
    }

    .about-list{
      list-style:none;
    }

    .about-list li{
      display:flex;
      align-items:flex-start;
      gap:13px;
      margin:16px 0;
      color:#475569;
      font-size:14px;
    }

    .about-list li::before{
      content:"✓";
      flex:none;
      width:25px;
      height:25px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f8efd9;
      color:var(--gold3);
      font-weight:bold;
      font-size:12px;
    }

    /* VISION */

    .vision{
      background:var(--light);
    }

    .vision-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:25px;
    }

    .vision-card{
      position:relative;
      padding:38px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      transition:.35s ease;
    }

    .vision-card::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:3px;
      background:linear-gradient(90deg,var(--gold),transparent);
      transform:scaleX(.2);
      transform-origin:left;
      transition:.4s;
    }

    .vision-card:hover{
      transform:translateY(-7px);
      box-shadow:var(--shadow);
    }

    .vision-card:hover::before{
      transform:scaleX(1);
    }

    .vision-icon{
      width:55px;
      height:55px;
      border-radius:13px;
      background:#f8efd9;
      color:var(--gold3);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      margin-bottom:21px;
    }

    .vision-card h3{
      color:var(--dark);
      margin-bottom:12px;
      font-size:22px;
    }

    .vision-card p{
      color:var(--muted);
      font-size:14px;
    }

    /* INSTITUTIONS */

    .institutions{
      background:#fff;
    }

    .institution-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .institution-card{
      padding:30px;
      min-height:215px;
      border:1px solid var(--border);
      border-radius:15px;
      background:#fff;
      position:relative;
      overflow:hidden;
      transition:.35s ease;
    }

    .institution-card::after{
      content:"";
      position:absolute;
      width:100px;
      height:100px;
      right:-55px;
      bottom:-55px;
      border:1px solid rgba(214,168,79,.15);
      border-radius:50%;
      transition:.4s;
    }

    .institution-card:hover{
      border-color:rgba(214,168,79,.65);
      transform:translateY(-7px);
      box-shadow:var(--shadow);
    }

    .institution-card:hover::after{
      transform:scale(1.8);
    }

    .institution-number{
      color:var(--gold3);
      font-size:10px;
      font-weight:bold;
      letter-spacing:1px;
      margin-bottom:13px;
    }

    .institution-card h3{
      color:var(--dark);
      margin-bottom:10px;
      font-size:19px;
    }

    .institution-card p{
      color:var(--muted);
      font-size:13px;
    }

    /* PROGRAM */

    .programs{
      background:
        radial-gradient(circle at 10% 20%,rgba(214,168,79,.08),transparent 25%),
        linear-gradient(135deg,#09111f,#111d30);
      color:#fff;
    }

    .programs .section-label{
      color:var(--gold2);
    }

    .programs .section-header h2{
      color:#fff;
    }

    .programs .section-header p{
      color:#91a0b4;
    }

    .program-grid{

      transition:.35s ease;
      position:relative;
      overflow:hidden;
    }

      transform:translateY(-6px);
    }

    .program-card:hover::before{
      transform:scaleX(1);
    }
